events {}

http {
    # Docker's embedded DNS. `backend` resolves to the IP of every running
    # instance, and a short `valid` makes nginx notice instances being added or
    # removed (docker compose up --scale) without a reload.
    resolver 127.0.0.11 valid=5s;

    # Needed for the websocket upgrade below: pass "upgrade" when the client asks
    # for it, "close" for ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # POST /snaps allows 10 MB photos (backend limit); leave room for the
        # multipart overhead. nginx's own default is 1 MB and would answer 413.
        client_max_body_size 11m;

        location / {
            # A variable in proxy_pass is what makes nginx re-resolve the name
            # (a plain `upstream` would freeze the IPs at startup). With several
            # addresses behind the name, nginx rotates through them — round-robin.
            set $backend http://backend:3000;
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket (socket.io with transports: ['websocket']). HTTP/1.1 is
            # required for Upgrade. The long read timeout keeps an idle socket
            # from being cut after nginx's default 60 s.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
